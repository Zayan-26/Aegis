services:
  #mts:
  #  image: "overv/openstreetmap-tile-server"
  #  volumes:
  #    - osm-data:/data/database
  #    - osm-tiles:/data/tiles
  #    - ./source/part_birmingham.osm.pbf:/data/region.osm.pbf
  #  command: "run"
    #ports:
    #  - "5432:5432"
  mts:
    image: "maptiler/tileserver-gl"
    volumes:
      - ./data:/data
      - ./style:/styles/omt
  cfd:
    image: cloudflare/cloudflared:latest
    environment:
      - TUNNEL_TOKEN 
      - "TUNNEL_LOGLEVEL=debug"
    command: "tunnel run"
  pois:
    image: postgis/postgis:latest
    environment:
      POSTGRES_DB: o2p
      POSTGRES_USER: o2p
      POSTGRES_PASSWORD: o2p
    volumes:
      - poi-data:/var/lib/postgresql/data
  osm2pgsql:
    image: iboates/osm2pgsql:latest
    environment:
      PGPASSWORD: o2p
    volumes:
      - ./source:/data/
  api:
    image: "postgrest/postgrest"
    environment:
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_DB_URI: postgres://o2p:o2p@pois:5432/o2p
      #PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: "3000"
volumes:
  poi-data:
    external: true
