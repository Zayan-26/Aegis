<script>
const TRIP_ENDPOINT = "INSERT ENDPOINT HERE"
const FAKE_USER_TOKEN = "ILIED"
const FAKE_ROUTE_TOKEN = "POEOPE"
const FAKE_LOCATION = JSON.stringify({
    latitude: 52.456228, longitude: -1.938147
})

export function createSocket(){
    return new WebSocket(TRIP_ENDPOINT)
}
export function startTrip(userToken, routeToken, socket){
    socket.send(JSON.stringify({
        // userToken,
        FAKE_USER_TOKEN,
        // routeToken,
        FAKE_ROUTE_TOKEN,

        type: "START_TRIP"
    }))
    //TODO: Start polling loop
} 
export function locationUpdate(userToken, location, socket){
    socket.send(JSON.stringify({
        // userToken,
        FAKE_USER_TOKEN,
        // location,
        FAKE_LOCATION,

        type: "LOCATION_UPDATE"
    }))
}
export function endTrip(userToken, routeToken, socket){
    //Proper termination should includ a validation message (I think), if you want it to just accept a close as a catch-all to end trip you can remove the message
    //If this is proper termination the server should terminate the connection not the client (probably)
    socket.send(JSON.stringify({
        // userToken,
        FAKE_USER_TOKEN,

        // routeToken
        FAKE_ROUTE_TOKEN,

        timestamp: Date().toLocaleString()
    }))
}
</script>
